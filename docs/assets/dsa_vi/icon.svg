<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" fill="none" role="img" aria-label="如意金股 RuyiDailyStockAnalysis">
  <defs>
    <linearGradient id="gPurple" x1="36" y1="36" x2="220" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="gHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C4B5FD" stop-opacity="0.6"/>
      <stop offset="0.7" stop-color="#C4B5FD" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#C4B5FD" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gGold" x1="170" y1="70" x2="200" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="softBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="tileShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#7C3AED" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- AI 光晕 (halo) -->
  <circle cx="128" cy="128" r="116" fill="url(#gHalo)" filter="url(#softBlur)"/>
  <circle cx="128" cy="128" r="100" fill="none" stroke="#EDE9FE" stroke-width="2" stroke-opacity="0.55"/>
  <circle cx="128" cy="128" r="112" fill="none" stroke="#EDE9FE" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- 圆角磁贴 -->
  <rect x="44" y="44" width="168" height="168" rx="44" fill="url(#gPurple)" filter="url(#tileShadow)"/>

  <!-- 上升 K 线 (sparkline) -->
  <path d="M76 170 L104 150 L126 160 L150 118 L180 92"
        fill="none" stroke="#FFFFFF" stroke-width="13"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 低位小钩（如意意象） -->
  <path d="M76 170 q-10 0 -10 -10" fill="none" stroke="#FFFFFF" stroke-width="13"
        stroke-linecap="round"/>

  <!-- 金股菱形节点（峰值） -->
  <rect x="168" y="74" width="26" height="26" rx="7" transform="rotate(45 181 87)"
        fill="url(#gGold)"/>
  <rect x="168" y="74" width="26" height="26" rx="7" transform="rotate(45 181 87)"
        fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.85"/>
</svg>