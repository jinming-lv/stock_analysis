<svg xmlns="http://www.w3.org/2000/svg" width="512" height="160" viewBox="0 0 512 160" fill="none" role="img" aria-label="如意金股 RuyiDailyStockAnalysis">
  <defs>
    <linearGradient id="dgPurple" x1="0" y1="0" x2="112" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="dgHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C4B5FD" stop-opacity="0.5"/>
      <stop offset="0.7" stop-color="#C4B5FD" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#C4B5FD" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dgGold" x1="78" y1="30" x2="98" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#FBBF24"/>
    </linearGradient>
    <filter id="dgTileShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#1E1B2E" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- mark -->
  <circle cx="56" cy="56" r="52" fill="url(#dgHalo)"/>
  <rect x="20" y="20" width="72" height="72" rx="19" fill="url(#dgPurple)" filter="url(#dgTileShadow)"/>
  <path d="M34 74 L46 64 L57 69 L69 52 L82 40" fill="none" stroke="#FFFFFF" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M34 74 q-4 0 -4 -4" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  <rect x="71" y="32" width="13" height="13" rx="3.5" transform="rotate(45 77.5 38.5)"
        fill="url(#dgGold)"/>

  <!-- wordmark -->
  <text x="112" y="70" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
        font-size="46" font-weight="800" fill="#F5F3FF">如意金股</text>
  <text x="114" y="104" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="20" font-weight="600" letter-spacing="2" fill="#C4B5FD">RuyiDailyStockAnalysis</text>
</svg>